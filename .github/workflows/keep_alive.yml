name: Keep App Awake

on:
  schedule:
    # Gira ogni 4 ore
    - cron: '0 */4 * * *'
  workflow_dispatch: 

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Simulazione visita reale
        run: |
          curl -I -L -X GET "https://test-la-tiunione-poteva-comunicattivamente.streamlit.app" \
          -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/91.0.4472.124 Safari/537.36"
